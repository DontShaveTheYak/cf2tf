name: Tests

on:
  push:
    branches:
      - 'master'
  pull_request:
    paths-ignore:
      - '.github/workflows/release.yml'
      - '.github/workflows/pr_checks.yml'
  merge_group:

jobs:
  get-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get.outputs.versions }}
      default: ${{ steps.get.outputs.default }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.1.0

      - name: Read Python versions from .python-versions
        id: get
        run: |
          VERSIONS=$(grep -v '^\s*$' .python-versions | jq -R -s -c 'split("\n") | map(select(length > 0))')
          DEFAULT=$(grep -v '^\s*$' .python-versions | head -1)
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "default=$DEFAULT" >> $GITHUB_OUTPUT

  pre_commit:
    needs: get-versions
    runs-on: ubuntu-latest
    name: Pre-commit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.1.0

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ needs.get-versions.outputs.default }}
          architecture: x64

      - name: Setup Poetry
        run: |
          pip install poetry
          poetry install

      - name: Run Pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: pytest

  multi:
    needs: [pre_commit, get-versions]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.get-versions.outputs.versions) }}
    name: Python ${{ matrix.python-version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.1.0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      # Install Poetry Nox and nox-poetry
      - name: Setup Environment
        run: |
          pip install poetry poetry-plugin-export nox nox-poetry

      - name: Run Tests
        run: nox -p ${{ matrix.python-version }}

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage.*
          if-no-files-found: error
          include-hidden-files: true

  coverage:
    needs: [multi, get-versions]
    runs-on: ubuntu-latest
    name: Coverage
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.1.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ needs.get-versions.outputs.default }}

      - name: Install Coverage
        run: uv tool install "coverage[toml]"

      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine Coverage
        run: coverage combine

      - name: Convert Coverage
        run: coverage xml --fail-under=0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.5
        with:
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
