[project]
name = "cf2tf"
version = "0.0.0"
description = "Convert Cloudformation Templates to Terraform."
readme = "README.md"
authors = [{ name = "Levi Blaney", email = "shadycuz@gmail.com" }]
keywords = [ "cloudformation", "terraform", "cf2tf", "convert", "cloud", "conversion"]
license = "GPL-3.0-only"
requires-python = ">=3.9"
dependencies = [
    "cfn-flip>=1.3.0,<2.0.0",
    "PyYAML>=6.0,<7.0",
    "click>=8.1.2,<9.0.0",
    "GitPython>=3.1.27,<4.0.0",
    "thefuzz[speedup]>=0.22.0,<0.23.0",
    "click-log>=0.4.0,<0.5.0",
    "requests>=2.27.1,<3.0.0",
]

[project.urls]
repository = "https://github.com/DontShaveTheYak/cf2tf"

[project.scripts]
cf2tf = "cf2tf.app:cli"

[dependency-groups]
dev = [
    "black>=25",
    "flake8>=7",
    "flake8-black>=0.3.3",
    "coverage[toml]>=7",
    "pytest>=8.0.0",
    "pytest-cov>=6",
    "mypy>=1.1",
]

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["cf2tf"]

[tool.coverage.report]
show_missing = true
