name: Tests

on:
  push:
    branches:
      - 'master'
  pull_request:
    paths-ignore:
      - '.github/workflows/release.yml'
      - '.github/workflows/pr_checks.yml'

jobs:
  get-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.3.1

      - name: Read Python versions from .python-versions
        id: get
        run: |
          python3 -c "
          import json
          versions = [l.strip() for l in open('.python-versions') if l.strip()]
          print('versions=' + json.dumps(versions))
          print('default=' + versions[0])
          " >> $GITHUB_OUTPUT

  pre_commit:
    needs: get-versions
    runs-on: ubuntu-latest
    name: Pre-commit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.3.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ needs.get-versions.outputs.default }}

      - name: Setup Poetry
        run: uv tool install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run Pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: pytest

  multi:
    needs: [pre_commit, get-versions]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.get-versions.outputs.versions) }}
    name: Python ${{ matrix.python-version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.3.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Environment
        run: |
          uv tool install poetry
          uv tool install nox --with nox-poetry

      # - name: Install dependencies
      #   run: poetry install

      - name: Run Tests
        run: nox -p ${{ matrix.python-version }}

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage.*
          if-no-files-found: error
          include-hidden-files: true

  coverage:
    needs: [multi, get-versions]
    runs-on: ubuntu-latest
    name: Coverage
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.3.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ needs.get-versions.outputs.default }}

      - name: Install Coverage
        run: uv tool install "coverage[toml]"

      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine Coverage
        run: coverage combine

      - name: Convert Coverage
        run: coverage xml --fail-under=0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.2
        with:
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
